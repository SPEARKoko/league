<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CENTRAL LEAGUE 积分榜</title>
<link rel="icon" href="logo.png">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#13241C; --muted:#5E6E66; --line:#DCE3DE;
  --pitch:#0F4D35; --pitch-ink:#FFFFFF; --gold:#C98A0E; --gold-soft:#FBF1DC;
  --win:#1C7C4E; --lose:#B83B3B; --chip:#E8EEEA; --focus:#C98A0E; --warn-bg:#FFF6E0;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0E1512; --surface:#16211C; --ink:#E8EFEA; --muted:#93A59B; --line:#28362F;
    --pitch:#1E7A55; --pitch-ink:#FFFFFF; --gold:#E7AE3A; --gold-soft:#2E2512;
    --win:#4CC58A; --lose:#EF7B7B; --chip:#223029; --focus:#E7AE3A; --warn-bg:#2B2410;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:15px;line-height:1.6;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums;font-family:"DIN Alternate","Roboto Condensed","Arial Narrow",-apple-system,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch);font-weight:700;padding:10px 20px}
button.danger{color:var(--lose)}
button.link{border:0;background:none;padding:2px 6px;color:var(--pitch);font-weight:600}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{width:56px;height:56px;border-radius:50%;flex:none}
.htext{flex:1;min-width:180px}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;line-height:1.2;text-wrap:balance}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:2px}
.hbtns{display:flex;gap:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=password],textarea,input[type=number]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%}
input[type=number].sm{width:76px}
textarea{min-height:180px;resize:vertical;line-height:1.7}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.setup{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:720px){.setup{grid-template-columns:1fr}}
.opts{display:flex;flex-direction:column;gap:14px}
details.card>summary{cursor:pointer;font-weight:700;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸ ";color:var(--muted)}
details.card[open]>summary::before{content:"▾ "}
details.card[open]>summary{margin-bottom:14px}

/* login */
.login{border-color:var(--gold);background:var(--gold-soft)}
.login h2{margin:0 0 4px;font-size:17px}
.err{color:var(--lose);font-size:13px;margin-top:6px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tabs{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:6px 14px}
.tabs button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button:disabled{opacity:1}
.legend{font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:5px;vertical-align:middle}

/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (max-width:360px){.groups{grid-template-columns:1fr}}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--pitch);color:var(--pitch-ink)}
.gletter{font-weight:800;font-size:22px;width:32px;height:32px;display:grid;place-items:center;border:2px solid currentColor;border-radius:6px}
.gname{font-weight:700;letter-spacing:.06em}
.gsub{margin-left:auto;font-size:12px;opacity:.85}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;color:var(--muted);font-weight:500;text-align:center;padding:6px 4px;border-bottom:1px solid var(--line)}
th:nth-child(2){text-align:left}
td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.pos{width:28px;color:var(--muted)}
td.nm{text-align:left;font-weight:500;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
td.pts{font-weight:800;font-size:17px}
tr.adv td.pos{color:var(--pitch);font-weight:800}
tr.adv td.pos::before,.prow.adv .pos::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:3px;vertical-align:middle}
.gd-pos{color:var(--win)} .gd-neg{color:var(--lose)}
.matches{border-top:1px dashed var(--line);padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.mtitle{font-size:11.5px;color:var(--muted);letter-spacing:.06em;padding:2px 4px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:3px 4px;border-radius:6px}
.match.done{background:var(--chip)}
.match .a{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .w{font-weight:800}
.sc{display:flex;align-items:center;gap:4px}
.sc span.colon{color:var(--muted)}
.score-in{width:40px;text-align:center;font-size:17px;font-weight:800;border:1px solid var(--line);border-radius:6px;padding:2px 0;background:var(--surface)}
.score-t{width:26px;text-align:center;font-size:16px;font-weight:800}
.prow{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pos{color:var(--muted);text-align:center}
.prow.adv .pos{color:var(--pitch);font-weight:800}
.prow .ppts{font-size:21px;font-weight:800;min-width:36px;text-align:right}
.steps{display:flex;gap:4px}
.steps button{padding:3px 0;width:38px;font-size:13px;border-radius:6px}
.steps .minus{color:var(--lose)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}

/* admin bar */
.abar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;z-index:10}
.abar .st{font-size:14px}
.abar .st b{color:var(--gold)}
.abar button{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.35)}
.abar button.primary{background:var(--gold);border-color:var(--gold);color:#1a1a1a}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
textarea.out{min-height:120px}
.notice{background:var(--warn-bg);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:13.5px}
/* stages */
.stages{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.stages button{flex:none;border-radius:999px;padding:6px 14px;display:inline-flex;align-items:center;gap:6px}
.stages button[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink);font-weight:700}
.stages .live{font-size:11px;font-weight:700;background:var(--gold);color:#1a1a1a;border-radius:999px;padding:0 7px;line-height:18px}
.stagehead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stagehead h2{margin:0;font-size:22px;font-weight:900}
.stagehead .sub{font-size:13px;color:var(--muted)}
.oldnote{font-size:13px;color:var(--muted);background:var(--chip);border-radius:8px;padding:6px 12px}
.champ{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FFE29A,#E3A82B);color:#2a1b00;border-radius:12px;padding:14px 18px}
.champ img{width:48px;height:48px;border-radius:50%}
.champ .k{font-size:12px;font-weight:700;letter-spacing:.12em}
.champ .v{font-size:24px;font-weight:900;line-height:1.2}
.advbox{border-color:var(--pitch)}
.advbox h3{margin:0 0 4px;font-size:17px}
.advgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
@media (max-width:720px){.advgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.png" alt="" onerror="this.remove()">
    <div class="htext">
      <h1 id="title">CENTRAL LEAGUE</h1>
      <div class="meta"><span id="updated">加载中…</span><span id="autoTip"></span></div>
    </div>
    <div class="hbtns">
      <button type="button" id="refreshBtn">刷新</button>
      <button type="button" id="adminBtn">管理</button>
    </div>
  </header>

  <!-- 管理员登录 -->
  <section class="card login" id="loginBox" hidden>
    <h2>管理员登录</h2>
    <p class="hint" style="margin:0 0 10px">输入管理密钥（GitHub 访问令牌）。密钥由 GitHub 核对，不会发给其他任何地方。</p>
    <form id="loginForm" class="row">
      <input type="password" id="tokenIn" placeholder="github_pat_…" autocomplete="off" style="flex:1;min-width:200px">
      <button class="primary" type="submit" id="loginGo">登录</button>
      <button type="button" id="loginCancel">取消</button>
    </form>
    <label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="remember"> 在这台设备上记住密钥（公用手机请勿勾选）</label>
    <div class="err" id="loginErr"></div>
  </section>

  <!-- 轮次页签：最新在最前 -->
  <nav class="stages" id="stageTabs" aria-label="轮次" hidden></nav>

  <div class="stagehead" id="stageHead" hidden><h2 id="stageName"></h2><span class="sub" id="stageSub"></span></div>
  <div class="oldnote" id="oldNote" hidden>这是往期结果。最新一轮在最前面的页签。</div>
  <div class="champ" id="champ" hidden><img src="logo.png" alt="" onerror="this.remove()"><div><div class="k">CHAMPION · 冠军</div><div class="v" id="champName"></div></div></div>

  <!-- 本轮设置与抽签（仅管理员） -->
  <details class="card" id="setupBox" hidden>
    <summary id="setupSummary">本轮设置与抽签</summary>
    <div class="setup">
      <div>
        <label class="lbl" for="titleIn">赛事名称（所有轮次共用）</label>
        <input type="text" id="titleIn" maxlength="40" style="margin-bottom:12px">
        <label class="lbl" for="namesIn">本轮名单（每行一个，也可用逗号、顿号分隔）</label>
        <textarea id="namesIn" spellcheck="false"></textarea>
        <div class="hint">共 <b id="nCount">0</b> 人 · <button type="button" class="link" id="sampleBtn">填入32人示例</button> <button type="button" class="link" id="clearBtn">清空</button></div>
      </div>
      <div class="opts">
        <div>
          <span class="lbl">分几组</span>
          <div class="seg" id="groupSeg"></div>
          <div class="row" style="margin-top:8px"><span class="hint" style="margin:0">自定义</span><input id="groupCustom" class="sm num" type="number" min="1" max="64" aria-label="自定义组数"></div>
          <p class="hint" id="perGroup"></p>
        </div>
        <div>
          <span class="lbl">抽签方式</span>
          <div class="seg" id="modeSeg">
            <button type="button" data-v="random">完全随机</button>
            <button type="button" data-v="pots">分档抽签</button>
          </div>
          <p class="hint">分档抽签像世界杯：名单按顺序分档，排在前面的是种子，每组每档各抽一人。</p>
        </div>
        <div class="row">
          <label class="lbl" for="advIn" style="margin:0">每组晋级名额</label>
          <input id="advIn" class="sm num" type="number" min="0" max="10">
        </div>
        <div class="row">
          <button class="primary" type="button" id="drawBtn">一键抽签分组</button>
        </div>
        <p class="hint" id="drawWarn" hidden>本轮已经抽过签了，重新抽签会清空本轮所有比分。</p>
      </div>
    </div>
  </details>

  <!-- 晋级下一轮（仅管理员、仅最新一轮） -->
  <section class="card advbox" id="advBox" hidden>
    <h3>晋级下一轮</h3>
    <p class="hint" style="margin:0" id="advIntro"></p>
    <p class="notice" id="advWarn" hidden style="margin:10px 0 0"></p>
    <div class="advgrid">
      <div>
        <label class="lbl" for="advNames">晋级名单（可以手动调整，排在前面的是种子）</label>
        <textarea id="advNames" spellcheck="false"></textarea>
        <div class="hint">共 <b id="advCount">0</b> 人 · 下一轮叫「<b id="advStageName"></b>」</div>
      </div>
      <div class="opts">
        <div>
          <span class="lbl">下一轮分几组</span>
          <div class="seg" id="advGroupSeg"></div>
          <div class="row" style="margin-top:8px"><span class="hint" style="margin:0">自定义</span><input id="advGroupCustom" class="sm num" type="number" min="1" max="64" aria-label="下一轮自定义组数"></div>
          <p class="hint" id="advPerGroup"></p>
        </div>
        <div>
          <span class="lbl">抽签方式</span>
          <div class="seg" id="advModeSeg">
            <button type="button" data-v="pots">分档抽签</button>
            <button type="button" data-v="random">完全随机</button>
          </div>
          <p class="hint">默认分档：各组第一名互相避开，不会提前碰面。</p>
        </div>
        <div class="row">
          <label class="lbl" for="advNextAdv" style="margin:0">下一轮每组晋级名额</label>
          <input id="advNextAdv" class="sm num" type="number" min="0" max="10">
        </div>
        <div class="row">
          <button class="primary" type="button" id="advGo">确认，抽签生成下一轮</button>
          <button type="button" id="advCancel">取消</button>
        </div>
      </div>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px">
    <div class="toolbar">
      <div class="tabs" id="scoreTabs" role="group" aria-label="计分方式">
        <button type="button" data-v="match">比赛计分</button>
        <button type="button" data-v="points">直接加分</button>
      </div>
      <div class="row">
        <span class="legend"><i></i>每组前 <b id="advN">2</b> 名晋级</span>
        <button type="button" id="copyBtn">复制结果文字</button>
      </div>
    </div>
    <div class="row" id="adminTools" hidden>
      <button type="button" class="primary" id="advOpen">晋级下一轮 →</button>
      <button type="button" class="danger" id="resetBtn">清零本轮比分</button>
      <button type="button" class="danger" id="delStageBtn">删除这一轮</button>
    </div>
    <p class="hint" id="modeHint" style="margin:0"></p>
    <div class="groups" id="groups"></div>
    <textarea class="out" id="outText" hidden readonly aria-label="结果文字"></textarea>
  </section>
</div>

<div class="abar" id="abar" hidden>
  <span class="st" id="abarSt">管理模式</span>
  <button type="button" class="primary" id="publishBtn">发布</button>
  <button type="button" id="discardBtn">撤销修改</button>
  <button type="button" id="logoutBtn">退出管理</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ 配置 ============
 * 放在 GitHub Pages 上时会自动识别仓库，一般不用改。
 * 如果用了自定义域名，才需要手动填 owner（GitHub 用户名）和 repo（仓库名）。 */
const CONFIG = { owner: "", repo: "", branch: "main", dataPath: "data.json", autoRefreshSec: 60 };

(function detect(){
  const h = location.hostname;
  if (!CONFIG.owner && h.endsWith(".github.io")) {
    CONFIG.owner = h.split(".")[0];
    const seg = location.pathname.split("/").filter(Boolean)[0];
    CONFIG.repo = seg && seg.indexOf(".") < 0 ? seg : h;
  }
})();

const $ = s => document.querySelector(s);
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const SAMPLE = ["西班牙","阿根廷","法国","英格兰","巴西","葡萄牙","荷兰","比利时","德国","克罗地亚","摩洛哥","哥伦比亚","乌拉圭","瑞士","日本","墨西哥","美国","挪威","塞内加尔","韩国","澳大利亚","厄瓜多尔","奥地利","伊朗","加拿大","埃及","苏格兰","巴拉圭","科特迪瓦","加纳","沙特","南非"];

/* 数据结构：{ title, updatedAt, stages: [第1轮, 第2轮, …] }，最后一轮是正在进行的 */
function newStage(opts){
  return Object.assign({ name: "", names: [], groupCount: 4, drawMode: "random", adv: 2, scoreMode: "match", groups: null, matches: null, pts: null, createdAt: null }, opts || {});
}
// 兼容旧版（没有 stages 的单轮数据）
function normalize(raw){
  const d = { title: (raw && raw.title) || "CENTRAL LEAGUE", updatedAt: (raw && raw.updatedAt) || null, stages: [] };
  if (raw && Array.isArray(raw.stages)) d.stages = raw.stages.map(s => newStage(s));
  else if (raw && (raw.groups || (raw.names && raw.names.length))) {
    d.stages = [newStage({ name: raw.groups ? stageName(countOf(raw.groups)) : "", names: raw.names || [], groupCount: raw.groupCount || 4, drawMode: raw.drawMode || "random", adv: raw.adv == null ? 2 : raw.adv, scoreMode: raw.scoreMode || "match", groups: raw.groups || null, matches: raw.matches || null, pts: raw.pts || null })];
  }
  if (!d.stages.length) d.stages.push(newStage());
  return d;
}
const countOf = groups => groups.reduce((n, g) => n + g.length, 0);
const stageName = n => n === 2 ? "决赛" : n + "强";

let data = null;      // 已发布的数据
let draft = null;     // 管理员编辑中的副本
let admin = false, token = null, sha = null, changes = 0, busy = false;
let sel = -1;         // 正在看第几轮（-1 = 最新）

const clone = o => JSON.parse(JSON.stringify(o));
const view = () => (admin ? draft : data) || normalize(null);
const selIndex = () => { const n = view().stages.length; return sel < 0 || sel >= n ? n - 1 : sel; };
const stage = () => view().stages[selIndex()];
const isLatest = () => selIndex() === view().stages.length - 1;
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function store(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }
function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
let tt; function toast(m, ms){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"), ms||2200); }

/* ============ 抽签与积分逻辑 ============ */
function parseNames(t){
  let parts = String(t||"").split(/[\n\r,，、;；\t]+/).map(s=>s.trim()).filter(Boolean);
  if (parts.length === 1 && /\s/.test(parts[0])) parts = parts[0].split(/\s+/);
  const seen = {}, out = [];
  parts.forEach(n => { let name=n, i=2; while(seen[name]) name = n+"("+(i++)+")"; seen[name]=1; out.push(name); });
  return out;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function drawGroups(names, g, mode){
  const groups = Array.from({length:g}, () => []);
  if (mode === "pots") {
    for (let p=0; p<names.length; p+=g) {
      const pot = shuffle(names.slice(p, p+g)), slots = shuffle([...Array(g).keys()]);
      pot.forEach((n,i) => groups[slots[i]].push(n));
    }
  } else shuffle(names).forEach((n,i) => groups[i%g].push(n));
  return groups;
}
function makeMatches(m){ const r=[]; for(let i=0;i<m.length;i++) for(let j=i+1;j<m.length;j++) r.push({a:m[i],b:m[j],sa:"",sb:""}); return r; }
function fillDraw(s, names){
  s.names = names;
  s.groups = drawGroups(names, s.groupCount, s.drawMode);
  s.matches = s.groups.map(makeMatches);
  s.pts = s.groups.map(g => g.map(() => 0));
  s.name = stageName(names.length);
  s.createdAt = new Date().toISOString();
}
const done = m => m.sa !== "" && m.sb !== "" && m.sa != null && m.sb != null;
function standings(members, matches){
  const t = {}; members.forEach(n => t[n] = {n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  (matches||[]).forEach(m => {
    if (!done(m) || !t[m.a] || !t[m.b]) return;
    const a=t[m.a], b=t[m.b], sa=+m.sa, sb=+m.sb;
    a.p++; b.p++; a.gf+=sa; a.ga+=sb; b.gf+=sb; b.ga+=sa;
    if (sa>sb){a.w++;b.l++;a.pts+=3;} else if (sa<sb){b.w++;a.l++;b.pts+=3;} else {a.d++;b.d++;a.pts++;b.pts++;}
  });
  return members.map(n=>t[n]).sort((x,y)=> y.pts-x.pts || (y.gf-y.ga)-(x.gf-x.ga) || y.gf-x.gf || members.indexOf(x.n)-members.indexOf(y.n));
}
function pointsRows(s, gi){
  const pts = (s.pts && s.pts[gi]) || [];
  return s.groups[gi].map((n,i)=>({n,i,v:pts[i]||0})).sort((x,y)=> y.v-x.v || x.i-y.i);
}
function ranked(s, gi){ return s.scoreMode === "points" ? pointsRows(s, gi).map(r => r.n) : standings(s.groups[gi], s.matches[gi]).map(r => r.n); }
// 晋级名单：先排各组第 1 名，再排各组第 2 名……（方便下一轮分档）
function qualifiers(s){
  const lists = s.groups.map((_, gi) => ranked(s, gi).slice(0, s.adv)), out = [];
  for (let k = 0; k < s.adv; k++) lists.forEach(l => { if (l[k] != null) out.push(l[k]); });
  return out;
}
function unfinished(s){
  if (s.scoreMode !== "match") return 0;
  return s.matches.reduce((n, g) => n + g.filter(m => !done(m)).length, 0);
}
function champion(s){
  if (!s || !s.groups || s.groups.length !== 1 || s.adv !== 1 || s.scoreMode !== "match") return null;
  if (unfinished(s)) return null;
  const st = standings(s.groups[0], s.matches[0]);
  if (st.length > 1 && st[0].pts === st[1].pts && (st[0].gf - st[0].ga) === (st[1].gf - st[1].ga) && st[0].gf === st[1].gf) return null; // 打平未分胜负
  return st[0] ? st[0].n : null;
}

/* ============ GitHub 读写 ============ */
const api = p => `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}${p}`;
const headers = () => ({ "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" });
function b64encode(str){ const bytes = new TextEncoder().encode(str); let bin=""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); }
function b64decode(b64){ const bin = atob(b64.replace(/\s/g,"")); const bytes = Uint8Array.from(bin, c => c.charCodeAt(0)); return new TextDecoder().decode(bytes); }
async function loadPublic(){
  const r = await fetch(CONFIG.dataPath + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("http " + r.status);
  return normalize(await r.json());
}
async function loadLatest(){
  const r = await fetch(api("/contents/" + CONFIG.dataPath + "?ref=" + CONFIG.branch + "&t=" + Date.now()), { headers: headers(), cache: "no-store" });
  if (r.status === 401) throw new Error("bad_token");
  if (r.status === 403 || r.status === 404) throw new Error("no_access");
  if (!r.ok) throw new Error("http " + r.status);
  const j = await r.json();
  sha = j.sha;
  return normalize(JSON.parse(b64decode(j.content)));
}
async function saveLatest(obj){
  const body = { message: "更新积分榜 " + new Date().toLocaleString("zh-CN", {hour12:false}), content: b64encode(JSON.stringify(obj, null, 1)), sha, branch: CONFIG.branch };
  const r = await fetch(api("/contents/" + CONFIG.dataPath), { method: "PUT", headers: headers(), body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) throw new Error("conflict");
  if (r.status === 401) throw new Error("bad_token");
  if (r.status === 403 || r.status === 404) throw new Error("no_write");
  if (!r.ok) throw new Error("http " + r.status);
  sha = (await r.json()).content.sha;
}

}
const playedText = (s, gi) => `组内对阵 · 已赛 ${s.matches[gi].filter(done).length}/${s.matches[gi].length}`;

            : `<span class="sc"><span class="score-t num">${ok ? esc(m.sa) : "-"}</span><span class="colon">:</span><span class="score-t num">${ok ? esc(m.sb) : "-"}</span></span>`;
          return `<div class="match ${ok?"done":""}"><span class="a ${aw?"w":""}" title="${esc(m.a)}">${esc(m.a)}</span>${mid}<span class="b ${bw?"w":""}" title="${esc(m.b)}">${esc(m.b)}</span></div>`;

        admin ? `<span class="steps"><button type="button" class="minus" data-g="${gi}" data-i="${r.i}" data-d="-1" aria-label="${esc(r.n)} 减 1 分">−1</button><button type="button" data-g="${gi}" data-i="${r.i}" data-d="1" aria-label="${esc(r.n)} 加 1 分">+1</button><button type="button" data-g="${gi}" data-i="${r.i}" data-d="3" aria-label="${esc(r.n)} 加 3 分">+3</button></span>` : `<span></span>`
      }<span class="ppts num">${r.v}</span></div>`).join("");

  }).join("");
}

/* ----- 本轮设置（管理员） ----- */
const SEG = [1,2,4,8];
function perGroupText(n, g){
  if (!n) return "";
  const lo = Math.floor(n/g), hi = Math.ceil(n/g);
  if (g > n) return "组数比人数还多，请减少组数";
  if (lo === hi) return lo === 2 ? `两两对决，共 ${g} 场` : `每组 ${lo} 人，组内每人赛 ${lo-1} 场，共 ${g*lo*(lo-1)/2} 场`;
  return `每组 ${lo}–${hi} 人（除不尽，有的组多一人）`;
}
function segOptions(n){ // 常用组数 + 两两对决
  const opts = new Set(SEG); if (n >= 4 && n % 2 === 0) opts.add(n/2);
  return [...opts].filter(v => !n || v <= n).sort((a,b)=>a-b);
}

}

function resultText(){

  s.groups.forEach((members, gi) => {
    lines.push("", groupLabel(s, gi));
    if (s.scoreMode === "points") pointsRows(s, gi).forEach((r,k) => lines.push(`${k+1}. ${r.n}  ${r.v}分${k<s.adv?" ✓":""}`));
    else standings(members, s.matches[gi]).forEach((r,k) => lines.push(`${k+1}. ${r.n}  ${r.w}胜${r.d}平${r.l}负  ${r.pts}分${k<s.adv?" ✓":""}`));
  });

  if (c) lines.push("", "冠军：" + c);

$("#adminBtn").onclick = () => {
  if (!CONFIG.owner || !CONFIG.repo) { toast("没识别到 GitHub 仓库：请把网页放到 GitHub Pages 上，或在代码顶部 CONFIG 里填写 owner 和 repo", 5000); return; }
  $("#loginBox").hidden = false; $("#loginErr").textContent = ""; $("#tokenIn").focus();
};
$("#loginCancel").onclick = () => { $("#loginBox").hidden = true; };
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const t = $("#tokenIn").value.trim(); if (!t) return;
  await login(t, $("#remember").checked);
});
async function login(t, remember){
  token = t; $("#loginGo").disabled = true; $("#loginErr").textContent = "";
  try {
    draft = await loadLatest();
    admin = true; changes = 0;
    if (remember) store("league-token", t);
    $("#loginBox").hidden = true; $("#tokenIn").value = "";
    $("#setupBox").open = !stage().groups;
    renderAll();
    toast("已进入管理模式");
  } catch (err) {
    token = null;
    const msg = { bad_token: "密钥不对或已过期，请检查后重试。", no_access: "这个密钥没有访问本仓库的权限：创建密钥时要选中这个仓库。" }[err.message] || "连接 GitHub 失败，请检查网络后重试。";
    $("#loginErr").textContent = msg;
    if (err.message === "bad_token") store("league-token", null);
    $("#loginBox").hidden = false;
  } finally { $("#loginGo").disabled = false; }
}
$("#publishBtn").onclick = async () => {
  if (!changes || busy) return;
  busy = true; renderAdminBar(); $("#abarSt").textContent = "正在发布…";
  try {
    draft.updatedAt = new Date().toISOString();
    await saveLatest(draft);
    data = clone(draft); changes = 0;
    toast("已发布。大约 1 分钟后，大家刷新就能看到", 3500);
  } catch (err) {
    if (err.message === "conflict") {
      toast("有其他管理员刚刚发布过。已载入最新版本，请重新修改后再发布", 5000);
      draft = await loadLatest().catch(() => draft); changes = 0;
    } else if (err.message === "no_write") {
      toast("这个密钥没有写入权限：创建密钥时 Contents 要选 Read and write", 5000);
    } else if (err.message === "bad_token") {
      toast("密钥已失效，请退出后重新登录", 5000);
    } else toast("发布失败，请检查网络后再点一次", 4000);
  } finally { busy = false; renderAll(); }
};
$("#discardBtn").onclick = async () => {
  if (!confirm("放弃所有未发布的修改？")) return;
  try { draft = await loadLatest(); } catch (e) { draft = clone(data || normalize(null)); }
  changes = 0; sel = -1; $("#advBox").hidden = true; renderAll();
};
$("#logoutBtn").onclick = () => {
  if (changes && !confirm("还有未发布的修改，退出会丢失。确定退出？")) return;
  admin = false; token = null; draft = null; changes = 0; sel = -1; store("league-token", null);
  $("#advBox").hidden = true;
  renderAll(); refresh();
};
window.addEventListener("beforeunload", e => { if (admin && changes) { e.preventDefault(); e.returnValue = ""; } });

/* ----- 观众刷新 ----- */
async function refresh(manual){
  if (admin) {
    if (!manual) return;
    if (changes) return toast("你有未发布的修改，先发布或撤销后再刷新");
    try { draft = await loadLatest(); renderAll(); toast("已载入最新数据"); } catch (e) { toast("刷新失败"); }
    return;
  }
  try {
    const d = await loadPublic();
    const changed = !data || d.updatedAt !== data.updatedAt;
    const newStageAdded = data && d.stages.length !== data.stages.length;
    data = d;
    if (newStageAdded) sel = -1; // 有新一轮时自动跳到最新
    if (changed) renderAll();
    if (manual) toast(changed ? "已更新" : "已经是最新");
  } catch (e) {
    if (!data) { $("#updated").textContent = "读取数据失败，请稍后刷新"; renderGroups(); }
    if (manual) toast("刷新失败，请检查网络");
  }
}
$("#refreshBtn").onclick = () => refresh(true);
setInterval(() => { if (!document.hidden) refresh(false); }, CONFIG.autoRefreshSec * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });

/* ----- 启动 ----- */
renderAll();
refresh(false).then(() => { const t = load("league-token"); if (t && CONFIG.owner) login(t, true); });
</script>
</body>
</html>
